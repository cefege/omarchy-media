[package]
name = "omarchy-media"
version = "0.1.0"
edition = "2021"
description = "Native replacements for the Omarchy display, audio and input shell commands"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
